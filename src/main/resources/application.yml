spring:
  profiles:
    active: local
# local
# release

  config:
    import: optional:file:.env[.properties]

jwt:
  secret:
    key: ${JWT_KEY}
    whitelist:
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-resources/**"
      - "/swagger-ui.html"
      - "/api/auth/**"
    adminlist:
      - "/api/admin/**"
  token:
    prefix: "Bearer"
    expiration: 1800000
